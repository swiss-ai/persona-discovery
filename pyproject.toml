[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apertus-pulse"
readme = "README.md"
authors = [{ name = "Wanja Pletscher" }]
version = "0.0.1"
# The pipeline ran with Python 3.12 (cluster container), the analysis was verified with Python 3.13.
requires-python = ">=3.12"
# Base install = the CPU-only analysis and figure stages (4*, 6a, 7*, 8*). Minimum versions are the
# ones the thesis figures were verified with; requirements-analysis.txt pins that environment exactly.
dependencies = [
    "numpy>=2.5.2",
    "scipy>=1.18.0",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "transformers>=5.14.0.dev0",   # admits the swiss-ai fork of the pipeline extra (5.14.0.dev0)
    "fire>=0.7.1",
    "hydra-core>=1.3.5",
    "omegaconf>=2.3.1",
    "tqdm>=4.70.0",
]

[project.urls]
Repository = "https://github.com/swiss-ai/persona-discovery"

[project.optional-dependencies]
# Live pull of the per-layer probe accuracy from W&B in src/4c_plot_layer_accuracy.py
# (not needed with the shipped cache files).
wandb = [
    "wandb>=0.21.0",
    "pandas>=3.0.5",        # used by wandb's run history
]
# Question download, activation capture, probe training, steering and judging (stages 0-3, 5a, 5b,
# 6b). On the cluster these run in the Swiss AI post-training container, where
# remote/submit_pipeline.sh installs this transformers revision for the model stages.
pipeline = [
    "datasets>=5.0.1",
    "accelerate>=1.14.0",   # used by transformers for device_map="auto"
    "wandb>=0.21.0",
    "transformers @ git+https://github.com/swiss-ai/transformers.git@3797303dda74844e3d1f8977ff5518bb91f818b4",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.metadata]
allow-direct-references = true
